<!DOCTYPE html>
<html>
<head>
<title>Secure Access...</title>
<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    text-align: center;
    font-family: monospace;
}

/* Matrix canvas */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* Neon Text */
.neon {
    font-size: 70px;
    margin-top: 120px;
    color: white;
    text-shadow:
        0 0 5px #ff00ff,
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 40px #ff00ff;
    display: none;
}

/* Message */
#message {
    display: none;
    color: white;
    font-size: 22px;
    margin-top: 20px;
}

/* Button */
button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: #ff00ff;
    color: white;
    cursor: pointer;
    margin-top: 30px;
    display: none;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<h2 id="loading" style="color:#00ff00; margin-top:200px;">
Initializing Hack Sequence...<br>
Accessing Sister Database...<br>
Decrypting Identity...
</h2>

<h1 class="neon" id="name">MANSI</h1>

<div id="message">
😂 It's a prank!<br><br>
System Confirmed: World's Best Sister ❤️
</div>

<button id="giftBtn" onclick="nextPage()">Receive Your Return Gift 🎁</button>

<!-- Background Music -->
<audio id="bgmusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
var canvas = document.getElementById("matrix");
var ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

var letters = "01MANSI";
letters = letters.split("");

var fontSize = 14;
var columns;
var drops;

function initMatrix() {
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    for (var i = 0; i < columns; i++) {
        drops[i] = 1;
    }
}
initMatrix();

function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0F0";
    ctx.font = fontSize + "px monospace";

    for (var i = 0; i < drops.length; i++) {
        var text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(draw, 40);
// Reveal prank after 4 seconds
setTimeout(function() {
    document.getElementById("loading").style.display = "none";
    document.getElementById("name").style.display = "block";
    document.getElementById("message").style.display = "block";
    document.getElementById("giftBtn").style.display = "inline-block";
}, 4000);

function nextPage() {
    window.location.href = "gift.html";
}

// Fix autoplay block (for some browsers)
document.body.addEventListener("click", function() {
    document.getElementById("bgmusic").play();
});
</script>

</body>
</html>
</body>
</html>
